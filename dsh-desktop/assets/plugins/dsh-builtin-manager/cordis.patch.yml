# dsh-builtin-manager 的 bundle 层 patch（自挂载声明）
#
# 用途：在「设置 → 插件」里增加一个「内置插件」页，逐条查看与启停随安装包内置的插件。
#
# 为什么必须由包自带这份 patch：纯插件包形态下没有壳层替我们写用户 profile 的
# cordis.patch.yml（旧 companion-profile 那台机器已退役）。真正把插件装进 cordis
# 插件栈的是包自己的这一层（由 package.json 的 dsh.bundle.patch 指过来）。
#
# ⚠ 稳定契约：id 是 cordis 补丁按行寻址的键，也是「内置插件」页里那条停用覆盖
#   （$DSH_HOME/profiles/<name>/cordis.patch.yml 的 "- id: dsh-builtin-manager / disabled: true"）
#   的匹配键。改 id 会让用户已写的覆盖失配成孤儿行；本仓库为此付过学费——
#   dsh-super-injector 的 id 与 bundle 层声明不一致时，自愈的 dropBlocksByIds 永不命中
#   残留行，造成双登记启动崩溃（issue #104）。不许改。
# ⚠ 本行禁止写 `disabled: !!js`：必选行上抛错会直接中断启动。
- insert:
    - id: dsh-builtin-manager
      name: 'dsh-builtin-manager'
